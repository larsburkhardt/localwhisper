        <main>
            <div class="card">
                <h2>Datei auswählen</h2>
                <div class="drop-zone" id="drop-zone">
                    <p>Datei hierher ziehen oder klicken zum Auswählen</p>
                    <input type="file" id="file-input" hidden accept=".mp4,.mkv,.avi,.mov,.mp3,.wav,.m4a,.ogg,.flac,.webm">

            <div class="card">
                <h2>Einstellungen</h2>
                <div class="controls">
                    <div class="form-group">
                        <label for="model-select">Whisper Modell</label>
                        <select id="model-select">
                            <option value="tiny">Tiny (Schnellst)</option>
                            <option value="base" selected>Base (Standard)</option>
                            <option value="small">Small (Besser)</option>
                            <option value="medium">Medium (Sehr gut)</option>
                            <option value="large-v3">Large v3 (Beste Qualität)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="language-select">Sprache (Optional)</label>
                        <select id="language-select">
                            <option value="">Automatisch erkennen</option>
                            <option value="de">Deutsch</option>
                            <option value="en">Englisch</option>
                            <option value="fr">Französisch</option>
                            <option value="es">Spanisch</option>
                            <option value="it">Italienisch</option>
                        </select>
                    </div>
                </div>
                <button class="primary" id="start-btn" disabled>Transkribieren starten</button>

                <div class="progress-container" id="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="status-text" id="status-text">Bereit...</div>
                </div>
            </div>

            <div class="result-area" id="result-area">
                <div class="card">
                    <h2>Transkript Vorschau</h2>
                    <textarea id="transcript-editor"></textarea>
                    <div class="actions">
                        <button class="primary" id="export-btn">Als Markdown exportieren</button>
                    </div>
                </div>
            </div>
        </main>

        <div class="system-info" id="system-info">
